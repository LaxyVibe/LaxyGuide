<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decap CMS | Laxy Lite Guide</title>
  <script>
    // Disable auto-init to prevent config loading issues
    window.CMS_MANUAL_INIT = true;
  </script>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
  <script>
    // Initialize CMS immediately after it loads
    window.addEventListener('load', function () {
      const DEFAULT_FIREBASE_WEB_CONFIG = {
        apiKey: 'AIzaSyA7V8lxX_z7nmuE-fGsFEIenzsBPDCNw64',
        authDomain: 'laxy-guide-dev.firebaseapp.com',
        projectId: 'laxy-guide-dev',
        storageBucket: 'laxy-guide-dev.firebasestorage.app',
        messagingSenderId: '434671355332',
        appId: '1:434671355332:web:7b9645abcc18f9c1fe5091'
      };

      let firebaseConfigPromise = null;

      function loadFirebaseConfig() {
        if (window.LAXY_FIREBASE_CONFIG) {
          return Promise.resolve(window.LAXY_FIREBASE_CONFIG);
        }

        if (!firebaseConfigPromise) {
          firebaseConfigPromise = fetch('/.netlify/functions/firebase-web-config', {
            method: 'GET',
            headers: {
              'Cache-Control': 'no-store'
            }
          })
            .then(function (response) {
              if (!response.ok) {
                throw new Error(`Failed to load Firebase config (${response.status})`);
              }

              return response.json();
            })
            .then(function (config) {
              window.LAXY_FIREBASE_CONFIG = config;
              return config;
            })
            .catch(function () {
              window.LAXY_FIREBASE_CONFIG = DEFAULT_FIREBASE_WEB_CONFIG;
              return window.LAXY_FIREBASE_CONFIG;
            });
        }

        return firebaseConfigPromise;
      }

      function ensureFirebaseApp() {
        return loadFirebaseConfig().then(function (config) {
          if (!window.firebase) {
            throw new Error('Firebase SDK failed to load');
          }

          const existingApp = window.firebase.apps && window.firebase.apps.length > 0
            ? window.firebase.apps[0]
            : null;

          if (existingApp) {
            return existingApp;
          }

          return window.firebase.initializeApp(config);
        });
      }

      function getFirebaseAuth() {
        if (!window.firebase) {
          throw new Error('Firebase SDK failed to load');
        }
        return ensureFirebaseApp().then(function () {
          return window.firebase.auth();
        });
      }

      function ensureFirebaseUser() {
        return getFirebaseAuth().then(function (auth) {
          if (auth.currentUser) {
            return auth.currentUser;
          }

          const provider = new window.firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          return auth.signInWithPopup(provider).then(function (result) {
            return result.user;
          });
        });
      }

      function parseJsonSafely(rawText) {
        try {
          return rawText ? JSON.parse(rawText) : null;
        } catch {
          return null;
        }
      }

      function formatCollectionSummary(label, section) {
        if (!section) {
          return `${label}: unavailable`;
        }

        const lines = [
          `${label}: ${section.uploadedCount || 0} uploaded, ${section.skippedCount || 0} skipped, ${section.failedCount || 0} failed`
        ];

        const failedEntries = Array.isArray(section.failed) ? section.failed.slice(0, 5) : [];
        failedEntries.forEach(function (entry) {
          lines.push(`  - ${entry.fileName}: ${entry.error || 'Unknown error'}`);
        });

        return lines.join('\n');
      }

      function formatPublishSummary(payload) {
        if (!payload) {
          return 'No publish summary returned.';
        }

        const lines = [
          `Branch: ${payload.branch || 'unknown'}`,
          `Commit: ${payload.commitSha || 'unknown'}`,
          `Exported at: ${payload.exportedAt || 'unknown'}`,
          '',
          formatCollectionSummary('Guides', payload.guides),
          formatCollectionSummary('POIs', payload.pois),
          '',
          `Manifest: ${payload.manifest && payload.manifest.publicUrl ? payload.manifest.publicUrl : 'not available'}`
        ];

        if (payload.manifest && payload.manifest.error) {
          lines.push(`Manifest error: ${payload.manifest.error}`);
        }

        return lines.join('\n');
      }

      function renderPublishPanel() {
        if (document.getElementById('laxy-content-publish-panel')) {
          return;
        }

        const panel = document.createElement('div');
        panel.id = 'laxy-content-publish-panel';
        Object.assign(panel.style, {
          position: 'fixed',
          top: '16px',
          right: '16px',
          width: 'min(360px, calc(100vw - 32px))',
          zIndex: '2147483647',
          borderRadius: '12px',
          background: 'rgba(15, 23, 42, 0.96)',
          color: '#f8fafc',
          boxShadow: '0 18px 40px rgba(15, 23, 42, 0.35)',
          padding: '14px',
          fontFamily: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
        });

        const title = document.createElement('div');
        title.textContent = 'Firebase Publish';
        Object.assign(title.style, {
          fontSize: '15px',
          fontWeight: '700',
          marginBottom: '6px'
        });

        const meta = document.createElement('div');
        meta.textContent = 'Google admin sign-in required to publish.';
        Object.assign(meta.style, {
          fontSize: '12px',
          lineHeight: '1.45',
          color: 'rgba(226, 232, 240, 0.92)',
          marginBottom: '10px'
        });

        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Publish to Firebase Storage';
        Object.assign(button.style, {
          width: '100%',
          border: 'none',
          borderRadius: '10px',
          padding: '10px 12px',
          fontSize: '14px',
          fontWeight: '700',
          cursor: 'pointer',
          background: '#22c55e',
          color: '#052e16'
        });

        const output = document.createElement('pre');
        output.textContent = '';
        Object.assign(output.style, {
          display: 'none',
          marginTop: '10px',
          marginBottom: '0',
          whiteSpace: 'pre-wrap',
          wordBreak: 'break-word',
          fontSize: '12px',
          lineHeight: '1.45',
          color: '#dbeafe',
          background: 'rgba(15, 23, 42, 0.45)',
          padding: '10px',
          borderRadius: '10px',
          maxHeight: '240px',
          overflow: 'auto'
        });

        panel.appendChild(title);
        panel.appendChild(meta);
        panel.appendChild(button);
        panel.appendChild(output);
        document.body.appendChild(panel);

        let isPublishing = false;

        function setPublishingState(nextState) {
          isPublishing = nextState;
          button.disabled = nextState;
          button.textContent = nextState ? 'Publishing…' : 'Publish to Firebase Storage';
          button.style.opacity = nextState ? '0.7' : '1';
          button.style.cursor = nextState ? 'progress' : 'pointer';
        }

        loadFirebaseAuthState();

        function loadFirebaseAuthState() {
          getFirebaseAuth().then(function (auth) {
            auth.onAuthStateChanged(function (user) {
              meta.textContent = user && user.email
                ? `Signed in as ${user.email} (${auth.app.options.projectId})`
                : 'Google admin sign-in required to publish.';
            });
          }).catch(function (error) {
            meta.textContent = error && error.message ? error.message : 'Firebase Auth is unavailable.';
          });
        }

        button.addEventListener('click', async function () {
          if (isPublishing) {
            return;
          }

          setPublishingState(true);
          output.style.display = 'none';
          output.textContent = '';

          try {
            const user = await ensureFirebaseUser();
            if (!user) {
              throw new Error('Google sign-in did not return a user');
            }

            const idToken = await user.getIdToken(true);
            const response = await fetch('/.netlify/functions/export-content-markdown', {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${idToken}`,
                'Content-Type': 'application/json'
              },
              body: '{}'
            });

            const rawText = await response.text();
            const payload = parseJsonSafely(rawText);

            if (!response.ok && response.status !== 207) {
              throw new Error((payload && payload.error) || `Publish failed (${response.status})`);
            }

            const finishedWithIssues = response.status === 207 || (payload && payload.ok === false);
            meta.textContent = finishedWithIssues
              ? 'Publish completed with issues. Review the summary below.'
              : 'Publish completed successfully.';
            output.textContent = formatPublishSummary(payload);
            output.style.display = 'block';
          } catch (error) {
            meta.textContent = error && error.message ? error.message : 'Publish failed.';
            output.textContent = '';
            output.style.display = 'none';
          } finally {
            setPublishingState(false);
          }
        });
      }

      if (window.CMS) {
        renderPublishPanel();

        // Custom TTML Widget
        const TTMLControl = window.createClass({
          getInitialState: function () {
            return {
              isOpen: false
            };
          },
          handleChange: function (e) {
            this.props.onChange(e.target.value);
          },
          openEditor: function () {
            this.setState({ isOpen: true });
            window.addEventListener('message', this.handleMessage);
          },
          closeEditor: function () {
            this.setState({ isOpen: false });
            window.removeEventListener('message', this.handleMessage);
          },
          handleMessage: function (event) {
            if (event.data.type === 'TTML_SAVE') {
              this.props.onChange(event.data.url);
              this.closeEditor();
            } else if (event.data.type === 'TTML_CLOSE') {
              this.closeEditor();
            }
          },
          render: function () {
            const value = this.props.value || '';
            const editorUrl = `https://laxy-ttml-editor.netlify.app/?ttml=${encodeURIComponent(value)}`;

            return window.h('div', {},
              window.h('div', { style: { display: 'flex', gap: '8px', alignItems: 'center' } },
                window.h('input', {
                  type: 'text',
                  value: value,
                  onChange: this.handleChange,
                  style: {
                    flex: 1,
                    padding: '8px',
                    border: '1px solid #ccc',
                    borderRadius: '4px'
                  }
                }),
                window.h('button', {
                  onClick: this.openEditor,
                  type: 'button',
                  style: {
                    padding: '8px 16px',
                    backgroundColor: '#007acc',
                    color: 'white',
                    border: 'none',
                    borderRadius: '4px',
                    cursor: 'pointer',
                    fontWeight: 'bold'
                  }
                }, 'Edit TTML')
              ),
              this.state.isOpen && window.h('div', {
                style: {
                  position: 'fixed',
                  top: 0,
                  left: 0,
                  width: '100vw',
                  height: '100vh',
                  zIndex: 99999,
                  backgroundColor: 'white',
                  display: 'flex',
                  flexDirection: 'column'
                }
              },
                window.h('iframe', {
                  src: editorUrl,
                  style: {
                    flex: 1,
                    width: '100%',
                    height: '100%',
                    border: 'none'
                  }
                })
              )
            );
          }
        });

        const TTMLPreview = window.createClass({
          render: function () {
            return window.h('div', { style: { padding: '10px', background: '#f0f0f0', borderRadius: '4px' } },
              window.h('strong', {}, 'TTML URL: '),
              this.props.value || '(empty)'
            );
          }
        });

        window.CMS.registerWidget('ttml', TTMLControl, TTMLPreview);

        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

        window.CMS.init({
          load_config_file: false,
          config: {
            logo: {
              src: "https://res.cloudinary.com/dui2mxeuh/image/upload/v1764660125/Group_9133_ufaz64.svg",
              show_in_header: true
            },
            backend: isLocal ? {
              name: 'github',
              repo: 'LaxyVibe/LaxyGuide',
              branch: 'v2'
            } : {
              name: 'git-gateway',
              repo: 'LaxyVibe/LaxyGuide',
              branch: 'v2'
            },
            local_backend: isLocal,
            media_folder: 'public/media',
            public_folder: '/media',
            media_library: {
              name: 'cloudinary',
              config: {
                cloud_name: 'dui2mxeuh',
                api_key: '569778884527558',
              },
            },
            i18n: {
              structure: 'single_file',
              locales: ['en-US', 'ja-JP', 'ko-KR', 'zh-TW', 'zh-CN', 'fr-FR'],
              default_locale: 'en-US'
            },
            collections: [
              {
                name: 'guide',
                label: 'Guide',
                folder: 'src/content/guides',
                create: true,
                slug: '{{code}}',
                summary: '{{code}} - {{title}}',
                i18n: true,
                fields: [
                  { label: 'Code', name: 'code', widget: 'string' },
                  { label: 'Title', name: 'title', widget: 'string', i18n: true },
                  { label: 'Underlay Image', name: 'guideUnderlayImage', widget: 'image', i18n: true },
                ]
              },
              {
                name: 'poi',
                label: 'POI',
                folder: 'src/content/pois',
                create: true,
                slug: '{{guide}}-{{number}}',
                summary: '{{guide}}-{{number}} - {{title}}',
                i18n: true,
                view_groups: [
                  { label: 'Guide', field: 'guide' }
                ],
                fields: [
                  {
                    label: 'Guide',
                    name: 'guide',
                    widget: 'relation',
                    collection: 'guide',
                    search_fields: ['title', 'code'],
                    value_field: 'code',
                    display_fields: ['code', 'title'],
                    required: false,
                    i18n: 'duplicate'
                  },
                  { label: 'Number', name: 'number', widget: 'string' },
                  { label: 'Title', name: 'title', widget: 'string', required: false, i18n: true },
                  { label: 'Hero Image', name: 'hero', widget: 'image', required: false, i18n: 'duplicate' },
                  { label: 'TTML Editor', name: 'ttml', widget: 'ttml', required: false, i18n: 'duplicate' },
                  { label: 'Display Audio', name: 'displayAudio', widget: 'boolean', default: true, required: false, i18n: 'duplicate' },
                  {
                    label: 'Metadata',
                    name: 'metadata',
                    widget: 'list',
                    required: false,
                    i18n: true,
                    fields: [
                      { label: 'Label', name: 'label', widget: 'string' },
                      { label: 'Value', name: 'value', widget: 'string' }
                    ]
                  },
                  { label: 'Content', name: 'content', widget: 'markdown', i18n: true, required: false}
                ]
              }
            ]
          }
        });
      }
    });
  </script>
</head>

<body>
  <!-- Decap CMS will create its own root element -->
</body>

</html>
