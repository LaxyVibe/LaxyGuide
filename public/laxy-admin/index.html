<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decap CMS | Laxy Lite Guide</title>
  <script>
    // Disable auto-init to prevent config loading issues
    window.CMS_MANUAL_INIT = true;
  </script>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Initialize CMS immediately after it loads
    window.addEventListener('load', function () {
      if (window.CMS) {
        window.CMS.init({

          config: {
            logo: {
              src: "https://res.cloudinary.com/dui2mxeuh/image/upload/v1764660125/Group_9133_ufaz64.svg",
              show_in_header: true
            },
            backend: {
              name: 'github',
              repo: 'LaxyVibe/LaxyLiteGuidePWA',
              branch: 'v2'
            },
            media_folder: 'public/media',
            public_folder: '/media',
            media_library: {
              name: 'cloudinary',
              config: {
                cloud_name: 'dui2mxeuh',
                api_key: '569778884527558',
              },
            },
            i18n: {
              structure: 'single_file',
              locales: ['en-US', 'ja-JP', 'ko-KR', 'zh-TW', 'zh-CN'],
              default_locale: 'en-US'
            },
            collections: [
              {
                name: 'guide',
                label: 'Guide',
                folder: 'src/content/guides',
                create: false,
                slug: '{{code}}',

                  { label: 'Hero Image', name: 'hero', widget: 'image', i18n: true },
                  { label: 'Audio URL', name: 'audio', widget: 'file', required: false, i18n: true },
                  { label: 'Subtitle URL', name: 'subtitle', widget: 'file', required: false, i18n: true },
                  {
                    label: 'Metadata',
                    name: 'metadata',
                    widget: 'list',
                    required: false,

                      { label: 'Label', name: 'label', widget: 'string' },
                      { label: 'Value', name: 'value', widget: 'string' }
                    ]
                  },
                  { label: 'Content', name: 'content', widget: 'markdown', i18n: true }

              {
                name: 'layout',

                  {
                    label: 'Color Palette',
                    name: 'colors',
                    file: 'src/content/layout/main.md',
                    fields: [
                      {
                        label: 'Primary Colors',
                        name: 'Primary',
                        widget: 'object',
                        fields: [
                          { label: '100', name: '100', widget: 'string' },
                          { label: '200', name: '200', widget: 'string' },
                          { label: '300', name: '300', widget: 'string' },
                          { label: '400', name: '400', widget: 'string' },
                          { label: '500', name: '500', widget: 'string' },
                          { label: '600', name: '600', widget: 'string' },
                          { label: 'Alpha', name: 'Alpha', widget: 'string' }

                          { label: '600', name: '600', widget: 'string' },

                          { label: '100', name: '100', widget: 'string' },
                          { label: '200', name: '200', widget: 'string' },
                          { label: '300', name: '300', widget: 'string' },
                          { label: '400', name: '400', widget: 'string' },
                          { label: '500', name: '500', widget: 'string' },
                          { label: '600', name: '600', widget: 'string' },

                          { label: '1000', name: '1000', widget: 'string' },
                          { label: 'Alpha', name: 'Alpha', widget: 'string' }
                        ]
                      },
                      {
                        label: 'Status & Utility Colors',
                        name: 'StatusUtility',
                        widget: 'object',
                        fields: [
                          {
                            label: 'Red',
                            name: 'Red',
                            widget: 'object',
                            fields: [
                              { label: '100', name: '100', widget: 'string' },
                              { label: '200', name: '200', widget: 'string' },
                              { label: 'Alpha', name: 'Alpha', widget: 'string' }
