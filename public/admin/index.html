<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decap CMS | Laxy Lite Guide</title>
  <script>
    // Disable auto-init to prevent config loading issues
    window.CMS_MANUAL_INIT = true;
  </script>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Initialize CMS immediately after it loads
    window.addEventListener('load', function () {
      if (window.CMS) {
        window.CMS.init({
          load_config_file: false,
          config: {
            backend: {
              name: 'github',
              repo: 'LaxyVibe/LaxyLiteGuidePWA',
              branch: 'v2'
            },
            media_folder: 'public/media',
            public_folder: '/media',
            i18n: {
              structure: 'single_file',
              locales: ['en-US', 'ja-JP', 'ko-KR', 'zh-TW', 'zh-CN'],
              default_locale: 'en-US'
            },
            collections: [
              {
                name: 'knowledgeBase',
                label: 'Knowledge Base',
                folder: 'src/content/knowledgeBase',
                create: true,
                slug: '{{slug}}',
                i18n: true,
                fields: [
                  { label: 'Title', name: 'title', widget: 'string', i18n: true },
                  {
                    label: 'POIs',
                    name: 'pois',
                    widget: 'list',
                    i18n: true,
                    fields: [
                      { label: 'Number', name: 'number', widget: 'string' },
                      { label: 'Title', name: 'title', widget: 'string' },
                      { label: 'Content', name: 'content', widget: 'markdown' },
                      { label: 'Hero Image', name: 'hero', widget: 'image' },
                      { label: 'Audio URL', name: 'audio', widget: 'string', required: false },
                      { label: 'Subtitle URL', name: 'subtitle', widget: 'string', required: false },
                      {
                        label: 'Metadata',
                        name: 'metadata',
                        widget: 'list',
                        required: false,
                        fields: [
                          { label: 'Label', name: 'label', widget: 'string' },
                          { label: 'Value', name: 'value', widget: 'string' }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          }
        });
      }
    });
  </script>
</head>

<body>
  <!-- Decap CMS will create its own root element -->
</body>

</html>
